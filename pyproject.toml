[project]
name = "autoresearch-overfit"
version = "0.1.0"
description = "Small tabular autoresearch harness to measure val-gated overfit and test mitigations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "openml>=0.14",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "anthropic>=0.39",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# results/<task>/train.py is generated by the LLM loop; reformatting it would
# corrupt the kept-trajectory record of what the agent actually produced.
extend-exclude = ["results/**/train.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — we sometimes have long LLM prompt strings
    "E741",  # ambiguous variable name — ok for ML code (e.g. `l` for loss)
]
